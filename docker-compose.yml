services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-card_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-card_system}
      MYSQL_USER: ${MYSQL_USER:-card_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-card_password}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - ${MYSQL_DATA_DIR:-./runtime/mysql}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    environment:
      CARD_ENV: ${CARD_ENV:-production}
      CARD_DATABASE_URL: mysql+pymysql://${MYSQL_USER:-card_user}:${MYSQL_PASSWORD:-card_password}@mysql:3306/${MYSQL_DATABASE:-card_system}?charset=utf8mb4
      CARD_SECRET_KEY: ${CARD_SECRET_KEY:-change-this-secret}
      CARD_DEFAULT_ADMIN_USER: ${CARD_DEFAULT_ADMIN_USER:-admin}
      CARD_DEFAULT_ADMIN_PASSWORD: ${CARD_DEFAULT_ADMIN_PASSWORD:-admin123456}
      CARD_DEFAULT_ADMIN_EMAIL: ${CARD_DEFAULT_ADMIN_EMAIL:-admin@example.com}
      CARD_ALLOW_DEV_RESET_LINK: ${CARD_ALLOW_DEV_RESET_LINK:-false}
      CARD_SMTP_HOST: ${CARD_SMTP_HOST:-}
      CARD_SMTP_PORT: ${CARD_SMTP_PORT:-587}
      CARD_SMTP_USER: ${CARD_SMTP_USER:-}
      CARD_SMTP_PASSWORD: ${CARD_SMTP_PASSWORD:-}
      CARD_SMTP_FROM: ${CARD_SMTP_FROM:-}
      CARD_SMTP_STARTTLS: ${CARD_SMTP_STARTTLS:-true}
      CARD_PUBLIC_BASE_URL: ${CARD_PUBLIC_BASE_URL:-}
      CARD_CORS_ORIGINS: ${CARD_CORS_ORIGINS:-}
      CARD_APP_VERSION: ${CARD_APP_VERSION:-dev}
      CARD_GIT_SHA: ${CARD_GIT_SHA:-unknown}
      CARD_LICENSE_SIGNING_KEY_FILE: ${CARD_LICENSE_SIGNING_KEY_FILE:-/run/secrets/keydesk-license-ed25519.pem}
      CARD_LICENSE_SIGNING_KEY_ID: ${CARD_LICENSE_SIGNING_KEY_ID:-license-dev-01}
      CARD_LICENSE_PREVIOUS_PUBLIC_KEYS: '${CARD_LICENSE_PREVIOUS_PUBLIC_KEYS:-}'
      CARD_LICENSE_PEPPER: ${CARD_LICENSE_PEPPER:-development-only-license-pepper}
      CARD_LICENSE_LEASE_TTL_SECONDS: ${CARD_LICENSE_LEASE_TTL_SECONDS:-300}
      CARD_LICENSE_NEXT_CHECK_SECONDS: ${CARD_LICENSE_NEXT_CHECK_SECONDS:-60}
      CARD_LICENSE_REQUEST_WINDOW_SECONDS: ${CARD_LICENSE_REQUEST_WINDOW_SECONDS:-120}
      CARD_LICENSE_NONCE_TTL_SECONDS: ${CARD_LICENSE_NONCE_TTL_SECONDS:-600}
      CARD_LICENSE_AUDIT_RETENTION_DAYS: ${CARD_LICENSE_AUDIT_RETENTION_DAYS:-90}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${CARD_LICENSE_SIGNING_KEY_FILE_HOST:-./secrets/keydesk-license-ed25519.pem}:/run/secrets/keydesk-license-ed25519.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport json, urllib.request\nwith urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5) as res:\n    data = json.loads(res.read().decode())\n    raise SystemExit(0 if data.get('success') else 1)\nPY"]
      interval: 10s
      timeout: 8s
      retries: 30
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${CARD_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
