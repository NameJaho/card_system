limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_reset:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=license_validate:10m rate=10r/s;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /api/adm/login {
    limit_req zone=auth_login burst=10 nodelay;
    proxy_pass http://backend:8000/api/adm/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/adm/forgotPassword {
    limit_req zone=auth_reset burst=3 nodelay;
    proxy_pass http://backend:8000/api/adm/forgotPassword;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/client/v1/license/validate {
    limit_req zone=license_validate burst=30 nodelay;
    proxy_pass http://backend:8000/api/client/v1/license/validate;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    proxy_pass http://backend:8000/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
